<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" >
<head>
	<th:block th:include="include :: header('修改商品')" />
</head>
<body class="white-bg">
	<div class="wrapper wrapper-content animated fadeInRight ibox-content">
		<form class="form-horizontal m" id="form-product-edit" th:object="${product}">
			<input id="productId" name="productId" type="hidden" th:field="*{productId}"/>
			<div class="form-group">
				<label class="col-sm-3 control-label is-required">商品编码：</label>
				<div class="col-sm-8">
					<input class="form-control" type="text" name="productCode" id="productCode" th:field="*{productCode}" required>
				</div>
			</div>
			<div class="form-group">
				<label class="col-sm-3 control-label is-required">商品名称：</label>
				<div class="col-sm-8">
					<input class="form-control" type="text" name="productName" id="productName" th:field="*{productName}" required>
				</div>
			</div>
			<div class="form-group">
				<label class="col-sm-3 control-label is-required">库存：</label>
				<div class="col-sm-8">
					<input class="form-control" type="number" name="stock" id="stock" min="0" th:field="*{stock}" required>
				</div>
			</div>
			<div class="form-group">
				<label class="col-sm-3 control-label">状态：</label>
				<div class="col-sm-8">
					<div class="radio-box" th:each="dict : ${@dict.getType('sys_normal_disable')}">
						<input type="radio" th:id="${'e'+dict.dictCode}" name="status" th:value="${dict.dictValue}" th:field="*{status}">
						<label th:for="${'e'+dict.dictCode}" th:text="${dict.dictLabel}"></label>
					</div>
				</div>
			</div>
			<div class="form-group">
				<label class="col-sm-3 control-label">备注：</label>
				<div class="col-sm-8">
					<textarea id="remark" name="remark" class="form-control">[[*{remark}]]</textarea>
				</div>
			</div>
		</form>
	</div>
	<th:block th:include="include :: footer" />
	<script type="text/javascript">
		var prefix = ctx + "operation/product";

		$("#form-product-edit").validate({
			onkeyup: false,
			rules: {
				productCode: {
					remote: {
						url: ctx + "operation/product/checkProductCodeUnique",
						type: "post",
						dataType: "json",
						data: {
							"productId": function() {
								return $("input[name='productId']").val();
							},
							"productCode": function() {
								return $.common.trim($("#productCode").val());
							}
						}
					}
				},
				stock: { digits: true }
			},
			messages: {
				"productCode": { remote: "商品编码已经存在" }
			},
			focusCleanup: true
		});

		function submitHandler() {
			if ($.validate.form()) {
				$.operate.save(prefix + "/edit", $('#form-product-edit').serialize());
			}
		}
	</script>
</body>
</html>
