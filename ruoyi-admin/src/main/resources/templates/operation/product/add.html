<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" >
<head>
	<th:block th:include="include :: header('新增商品')" />
</head>
<body class="white-bg">
	<div class="wrapper wrapper-content animated fadeInRight ibox-content">
		<form class="form-horizontal m" id="form-product-add">
			<div class="form-group">
				<label class="col-sm-3 control-label is-required">商品编码：</label>
				<div class="col-sm-8">
					<input class="form-control" type="text" name="productCode" id="productCode" required>
				</div>
			</div>
			<div class="form-group">
				<label class="col-sm-3 control-label is-required">商品名称：</label>
				<div class="col-sm-8">
					<input class="form-control" type="text" name="productName" id="productName" required>
				</div>
			</div>
			<div class="form-group">
				<label class="col-sm-3 control-label is-required">单价：</label>
				<div class="col-sm-8">
					<input class="form-control" type="number" name="price" id="price" step="0.01" min="0" required>
				</div>
			</div>
			<div class="form-group">
				<label class="col-sm-3 control-label is-required">库存：</label>
				<div class="col-sm-8">
					<input class="form-control" type="number" name="stock" id="stock" min="0" required>
				</div>
			</div>
			<div class="form-group">
				<label class="col-sm-3 control-label">状态：</label>
				<div class="col-sm-8">
					<div class="radio-box" th:each="dict : ${@dict.getType('sys_normal_disable')}">
						<input type="radio" th:id="${dict.dictCode}" name="status" th:value="${dict.dictValue}" th:checked="${dict.default}">
						<label th:for="${dict.dictCode}" th:text="${dict.dictLabel}"></label>
					</div>
				</div>
			</div>
			<div class="form-group">
				<label class="col-sm-3 control-label">备注：</label>
				<div class="col-sm-8">
					<textarea id="remark" name="remark" class="form-control"></textarea>
				</div>
			</div>
		</form>
	</div>
	<th:block th:include="include :: footer" />
	<script type="text/javascript">
		var prefix = ctx + "operation/product";

		$("#form-product-add").validate({
			onkeyup: false,
			rules: {
				productCode: {
					remote: {
						url: ctx + "operation/product/checkProductCodeUnique",
						type: "post",
						dataType: "json",
						data: {
							"productCode": function() {
								return $.common.trim($("#productCode").val());
							}
						}
					}
				},
				stock: { digits: true }
			},
			messages: {
				"productCode": { remote: "商品编码已经存在" }
			},
			focusCleanup: true
		});

		function submitHandler() {
			if ($.validate.form()) {
				$.operate.save(prefix + "/add", $('#form-product-add').serialize());
			}
		}
	</script>
</body>
</html>
